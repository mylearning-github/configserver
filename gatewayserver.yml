spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true #This is used for the get the details from the eureka service registry and false is for dont use for the existing one use only from the apigateay url
              lowerCaseServiceId: true #This is for the service url name should be in lowercase

server:
  port: 8505

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: UNRESTRICTED
  
