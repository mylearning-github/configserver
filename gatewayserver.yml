server:
  port: 8505

eureka:
  instance:
    # below ip address is true because in localhost we are not using any dns right if we add this it will generate random ip address
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
