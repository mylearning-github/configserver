spring:
  
  cloud: #this configuration is about connections with eureka discovery server
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true

server:
  port: 8505

eureka:
  instance:
    # below ip address is true because in localhost we are not using any dns right if we add this it will generate random ip address
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    shutdown:
      access: UNRESTRICTED        -
