server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eazybytes
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
management:
  endpoints:
    web:
      exposure:
        include:
          - "*"        
eureka:
  instance:
    # below ip address is true because in localhost we are not using any dns right if we add this it will generate random ip address
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka        
